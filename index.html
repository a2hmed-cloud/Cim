<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyHub | منصة المذاكرة</title>

<style>
:root{
  --bg:#080b12;
  --panel:#111722;
  --panel2:#171e2b;
  --text:#f4f7fb;
  --muted:#8d98aa;
  --accent:#55b8ff;
  --accent2:#7c6cff;
  --line:rgba(255,255,255,.08);
  --green:#35d39a;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 80% -10%,rgba(85,184,255,.12),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  position:sticky;
  top:0;
  z-index:50;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  background:rgba(8,11,18,.82);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:var(--accent);
}

.header-right{
  display:flex;
  gap:10px;
  align-items:center;
}

.progress-mini{
  color:var(--muted);
  font-size:13px;
}

.container{
  width:min(1450px,94%);
  margin:auto;
  padding:28px 0 50px;
}

.hero{
  padding:10px 0 28px;
}

.hero h1{
  font-size:clamp(28px,5vw,48px);
  line-height:1.1;
  margin-bottom:10px;
}

.hero p{
  color:var(--muted);
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  gap:22px;
}

.player-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  position:sticky;
  top:92px;
}

.player{
  position:relative;
  aspect-ratio:16/9;
  background:#000;
}

.player iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}

.player-info{
  padding:20px;
}

.player-info h2{
  font-size:21px;
  margin-bottom:7px;
}

.player-info p{
  color:var(--muted);
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:17px;
}

.action{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  padding:9px 13px;
  border-radius:10px;
}

.action:hover{
  border-color:rgba(85,184,255,.5);
}

.action.primary{
  background:var(--accent);
  color:#06101a;
  border:0;
  font-weight:700;
}

.progress-box{
  margin-top:17px;
}

.progress-line{
  height:7px;
  background:#252d3a;
  border-radius:99px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:.25s;
}

.progress-text{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}

.tabs{
  display:flex;
  gap:8px;
  padding:0 20px 20px;
  overflow:auto;
}

.tab{
  white-space:nowrap;
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  padding:9px 14px;
  border-radius:10px;
}

.tab.active{
  color:white;
  background:var(--panel2);
  border-color:rgba(85,184,255,.35);
}

.panel{
  display:none;
  padding:0 20px 20px;
}

.panel.active{
  display:block;
}

.note-area{
  width:100%;
  min-height:150px;
  resize:vertical;
  background:#0b1018;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  color:white;
  outline:none;
}

.save-note{
  margin-top:9px;
}

.chapter{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px;
  margin-bottom:8px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#0d131d;
  cursor:pointer;
}

.chapter:hover{
  background:var(--panel2);
}

.chapter-time{
  color:var(--accent);
  font-weight:700;
  direction:ltr;
}

.playlist{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.playlist-title{
  font-size:17px;
  margin-bottom:4px;
}

.video-card{
  display:flex;
  gap:11px;
  padding:10px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  cursor:pointer;
  transition:.18s;
}

.video-card:hover{
  transform:translateY(-1px);
  background:var(--panel2);
}

.video-card.active{
  border-color:rgba(85,184,255,.65);
  box-shadow:0 0 0 1px rgba(85,184,255,.1);
}

.thumb{
  width:120px;
  height:68px;
  object-fit:cover;
  border-radius:9px;
  background:#000;
  flex-shrink:0;
}

.video-details{
  min-width:0;
  flex:1;
}

.video-title{
  font-weight:700;
  font-size:14px;
  line-height:1.4;
}

.video-meta{
  margin-top:7px;
  display:flex;
  justify-content:space-between;
  gap:5px;
  color:var(--muted);
  font-size:11px;
}

.video-progress{
  margin-top:7px;
  height:4px;
  background:#252d3a;
  border-radius:99px;
  overflow:hidden;
}

.video-progress div{
  height:100%;
  background:var(--green);
  width:0;
}

.search{
  width:100%;
  background:#0c1119;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  color:white;
  outline:none;
  margin-bottom:12px;
}

.section{
  margin-top:28px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;
}

.stat strong{
  display:block;
  font-size:24px;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

.capture{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.capture.show{
  display:flex;
}

.capture img{
  max-width:95%;
  max-height:85%;
  border-radius:15px;
}

.close-capture{
  position:absolute;
  top:20px;
  left:20px;
  padding:10px 14px;
  border:0;
  border-radius:10px;
}

@media(max-width:1000px){
  .layout{
    grid-template-columns:1fr;
  }

  .player-card{
    position:relative;
    top:0;
  }
}

@media(max-width:600px){
  .header{
    padding:0 15px;
  }

  .container{
    width:94%;
  }

  .thumb{
    width:100px;
    height:58px;
  }

  .stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Study<span>Hub</span></div>

  <div class="header-right">
    <div class="progress-mini" id="overallProgress">
      0% مكتمل
    </div>
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>ذاكر بذكاء.</h1>
    <p>كل فيديوهاتك في مكان واحد، مع متابعة تقدمك وملاحظاتك.</p>
  </section>

  <section class="layout">

    <!-- المشغل -->
    <div>

      <div class="player-card">

        <div class="player">
          <iframe
            id="player"
            src=""
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>

        <div class="player-info">

          <h2 id="currentTitle">اختر درسًا للبدء</h2>

          <p id="currentCategory">
            —
          </p>

          <div class="actions">

            <button class="action primary" onclick="openYoutube()">
              فتح على YouTube ↗
            </button>

            <button class="action" onclick="fullscreenPlayer()">
              ⛶ ملء الشاشة
            </button>

            <button class="action" onclick="takeScreenshot()">
              📸 لقطة شاشة
            </button>

            <button class="action" onclick="markComplete()">
              ✓ إتمام الفيديو
            </button>

          </div>

          <div class="progress-box">

            <div class="progress-line">
              <div class="progress-fill" id="mainProgress"></div>
            </div>

            <div class="progress-text">
              <span>تقدم الدرس</span>
              <span id="progressNumber">0%</span>
            </div>

          </div>

        </div>

        <div class="tabs">

          <button class="tab active" onclick="switchTab('chapters',this)">
            Chapters
          </button>

          <button class="tab" onclick="switchTab('notes',this)">
            ملاحظاتي
          </button>

          <button class="tab" onclick="switchTab('summary',this)">
            مراجعة
          </button>

        </div>

        <div class="panel active" id="chapters"></div>

        <div class="panel" id="notes">

          <textarea
            id="noteArea"
            class="note-area"
            placeholder="اكتب ملاحظاتك عن هذا الفيديو هنا..."></textarea>

          <button class="action primary save-note" onclick="saveNote()">
            حفظ الملاحظات
          </button>

        </div>

        <div class="panel" id="summary">

          <div style="color:var(--muted);line-height:1.8">
            استخدم هذا المكان لاحقًا لإضافة ملخص الدرس،
            أهم القواعد، والأسئلة المهمة.
          </div>

        </div>

      </div>

      <section class="section">

        <div class="stats">

          <div class="stat">
            <strong id="watchedCount">0</strong>
            <span>فيديو مكتمل</span>
          </div>

          <div class="stat">
            <strong id="videoCount">0</strong>
            <span>إجمالي الفيديوهات</span>
          </div>

          <div class="stat">
            <strong id="averageProgress">0%</strong>
            <span>متوسط التقدم</span>
          </div>

        </div>

      </section>

    </div>

    <!-- القائمة -->
    <aside>

      <input
        class="search"
        id="search"
        placeholder="🔎 ابحث عن فيديو..."
        oninput="renderPlaylist()">

      <div class="playlist">

        <div class="playlist-title">
          الدروس والفيديوهات
        </div>

        <div id="playlistContainer"></div>

      </div>

    </aside>

  </section>

</main>

<!-- Screenshot -->
<div class="capture" id="capture">

  <button
    class="close-capture"
    onclick="closeCapture()">
    إغلاق
  </button>

  <img id="captureImage" alt="Screenshot">

</div>

<script>

/* =========================================
   الفيديوهات
========================================= */

const videos = [

  {
    id:"tLfmappSCa8",
    title:"الفيديو الأول",
    category:"محتوى تعليمي",
    chapters:[]
  },

  {
    id:"r0UhFLB8cdk",
    title:"الفيديو الثاني",
    category:"محتوى تعليمي",
    chapters:[]
  },

  {
    id:"MM9IhSjT4ZU",
    title:"الفيديو الثالث",
    category:"محتوى تعليمي",
    chapters:[]
  },

  {
    id:"zO7wqvEDWU",
    title:"الفيديو الرابع",
    category:"محتوى تعليمي",
    chapters:[]
  },

  {
    id:"TlqRz_X1azc",
    title:"الفيديو الخامس",
    category:"محتوى تعليمي",
    chapters:[]
  },

  {
    id:"nKrNZ1hTwqQ",
    title:"الفيديو السادس",
    category:"محتوى تعليمي",
    chapters:[]
  },

  {
    id:"6iC9EcP8BS4",
    title:"الفيديو السابع",
    category:"محتوى تعليمي",
    chapters:[]
  }

];

/* =========================================
   تصحيح ID الفيديو الرابع
========================================= */

videos[3].id = "zO7w0qvEDWU";


let currentIndex = 0;


/* =========================================
   Local Storage
========================================= */

function getProgress(){

  return JSON.parse(
    localStorage.getItem("studyhub_progress") || "{}"
  );

}

function saveProgress(data){

  localStorage.setItem(
    "studyhub_progress",
    JSON.stringify(data)
  );

}

function getNotes(){

  return JSON.parse(
    localStorage.getItem("studyhub_notes") || "{}"
  );

}


/* =========================================
   تشغيل الفيديو
========================================= */

function playVideo(index){

  currentIndex = index;

  const video = videos[index];

  document.getElementById("player").src =
    `https://www.youtube.com/embed/${video.id}?autoplay=1&rel=0`;

  document.getElementById("currentTitle").textContent =
    video.title;

  document.getElementById("currentCategory").textContent =
    video.category;

  loadCurrentProgress();

  loadNotes();

  renderChapters();

  renderPlaylist();

}


/* =========================================
   Chapters
========================================= */

function renderChapters(){

  const box = document.getElementById("chapters");

  const video = videos[currentIndex];

  if(!video.chapters.length){

    box.innerHTML = `
      <div style="
        color:var(--muted);
        padding:10px 0;
        line-height:1.8
      ">
        لم يتم تحديد Chapters لهذا الفيديو بعد.
        <br>
        عند إضافة أوقات الأجزاء الفعلية للفيديو
        ستظهر هنا تلقائيًا.
      </div>
    `;

    return;

  }

  box.innerHTML = video.chapters.map(chapter => `

    <div class="chapter"
         onclick="jumpTo(${chapter.time})">

      <span>${chapter.title}</span>

      <span class="chapter-time">
        ${formatTime(chapter.time)}
      </span>

    </div>

  `).join("");

}


/*
  تشغيل Chapter:
  YouTube embed لا يسمح دائمًا بالتحكم
  في seek بدون YouTube IFrame API،
  لذلك نحفظ البنية الآن ونضيف API لاحقًا.
*/

function jumpTo(seconds){

  const video = videos[currentIndex];

  document.getElementById("player").src =
    `https://www.youtube.com/embed/${video.id}?autoplay=1&start=${seconds}&rel=0`;

}


/* =========================================
   Progress
========================================= */

function loadCurrentProgress(){

  const progress = getProgress();

  const value =
    Number(progress[videos[currentIndex].id] || 0);

  document.getElementById("mainProgress").style.width =
    value + "%";

  document.getElementById("progressNumber").textContent =
    value + "%";

}


function markComplete(){

  const progress = getProgress();

  progress[videos[currentIndex].id] = 100;

  saveProgress(progress);

  loadCurrentProgress();

  renderPlaylist();

  updateStats();

}


/* =========================================
   Playlist
========================================= */

function renderPlaylist(){

  const search =
    document.getElementById("search").value
      .trim()
      .toLowerCase();

  const progress = getProgress();

  const container =
    document.getElementById("playlistContainer");

  container.innerHTML = "";

  videos
    .map((video,index)=>({video,index}))
    .filter(item =>
      item.video.title.toLowerCase().includes(search)
    )
    .forEach(({video,index})=>{

      const value =
        Number(progress[video.id] || 0);

      const card =
        document.createElement("div");

      card.className =
        "video-card" +
        (index === currentIndex ? " active" : "");

      card.onclick =
        () => playVideo(index);

      card.innerHTML = `

        <img
          class="thumb"
          src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg"
          alt="thumbnail">

        <div class="video-details">

          <div class="video-title">
            ${video.title}
          </div>

          <div class="video-meta">

            <span>
              ${video.category}
            </span>

            <span>
              ${value}%
            </span>

          </div>

          <div class="video-progress">
            <div style="width:${value}%"></div>
          </div>

        </div>

      `;

      container.appendChild(card);

    });

}


/* =========================================
   Notes
========================================= */

function loadNotes(){

  const notes = getNotes();

  document.getElementById("noteArea").value =
    notes[videos[currentIndex].id] || "";

}


function saveNote(){

  const notes = getNotes();

  notes[videos[currentIndex].id] =
    document.getElementById("noteArea").value;

  localStorage.setItem(
    "studyhub_notes",
    JSON.stringify(notes)
  );

}


/* =========================================
   Tabs
========================================= */

function switchTab(name,button){

  document
    .querySelectorAll(".panel")
    .forEach(panel =>
      panel.classList.remove("active")
    );

  document
    .querySelectorAll(".tab")
    .forEach(tab =>
      tab.classList.remove("active")
    );

  document
    .getElementById(name)
    .classList.add("active");

  button.classList.add("active");

}


/* =========================================
   YouTube
========================================= */

function openYoutube(){

  const id =
    videos[currentIndex].id;

  window.open(
    `https://youtu.be/${id}`,
    "_blank"
  );

}


/* =========================================
   Fullscreen
========================================= */

function fullscreenPlayer(){

  const iframe =
    document.getElementById("player");

  if(iframe.requestFullscreen){

    iframe.requestFullscreen();

  }

}


/* =========================================
   Screenshot
========================================= */

function takeScreenshot(){

  /*
    لا يمكن للمتصفح أخذ Screenshot مباشر
    من محتوى iframe الخاص بـ YouTube بسبب
    قيود الأمان/CORS.

    لذلك نعرض تعليمات للمستخدم بدل تنفيذ
    عملية غير موثوقة.
  */

  alert(
    "لقطة الشاشة من داخل فيديو YouTube مباشرة تحتاج استخدام Screenshot الخاص بالجهاز أو إضافة مصدر فيديو تملكه المنصة."
  );

}


/* =========================================
   الإحصائيات
========================================= */

function updateStats(){

  const progress = getProgress();

  let total = 0;
  let completed = 0;

  videos.forEach(video=>{

    const value =
      Number(progress[video.id] || 0);

    total += value;

    if(value >= 100){
      completed++;
    }

  });

  const average =
    videos.length
      ? Math.round(total / videos.length)
      : 0;

  document.getElementById("watchedCount")
    .textContent = completed;

  document.getElementById("videoCount")
    .textContent = videos.length;

  document.getElementById("averageProgress")
    .textContent = average + "%";

  document.getElementById("overallProgress")
    .textContent = average + "% مكتمل";

}


/* =========================================
   الوقت
========================================= */

function formatTime(seconds){

  const m =
    Math.floor(seconds / 60)
      .toString()
      .padStart(2,"0");

  const s =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2,"0");

  return `${m}:${s}`;

}


/* =========================================
   البداية
========================================= */

document.getElementById("videoCount")
  .textContent = videos.length;

renderPlaylist();

playVideo(0);

updateStats();

</script>

</body>
</html>
